<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NADHEMNI - Gestion d'Entreprise</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0284c7;
      --color-primary-dark: #0369a1;
      --color-secondary: #0891b2;
      --color-success: #16a34a;
      --color-danger: #dc2626;
      --color-warning: #f59e0b;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-border: #e2e8f0;
      --color-text: #1e293b;
      --color-text-muted: #64748b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-lg: 0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.06);
    }

    body.dark-mode, body.dark-theme {
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-border: #334155;
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
    }

    body.dark-mode, body.dark-theme {
      background: #0f172a;
      color: #f1f5f9;
    }

    body.dark-mode .mat-card, body.dark-theme .mat-card,
    body.dark-mode mat-card, body.dark-theme mat-card {
      background: #1e293b;
      color: #f1f5f9;
      border-color: #334155;
    }

    body.dark-mode .settings-card,
    body.dark-theme .settings-card,
    body.dark-mode .section-card,
    body.dark-theme .section-card {
      background: #1e293b !important;
      color: #f1f5f9;
      border-color: #334155;
    }

    body.dark-mode .mat-form-field,
    body.dark-theme .mat-form-field {
      background: #334155;
    }

    body.dark-mode input, body.dark-theme input,
    body.dark-mode textarea, body.dark-theme textarea {
      background: #334155 !important;
      color: #f1f5f9 !important;
      border-color: #475569 !important;
    }

    body.dark-mode .mat-form-field-label,
    body.dark-theme .mat-form-field-label {
      color: #94a3b8 !important;
    }

    body.dark-mode .page-container, body.dark-theme .page-container,
    body.dark-mode .container, body.dark-theme .container,
    body.dark-mode .main-content, body.dark-theme .main-content,
    body.dark-mode .tab-content, body.dark-theme .tab-content {
      background: #0f172a !important;
    }

    body.dark-mode .mat-drawer-container,
    body.dark-theme .mat-drawer-container,
    body.dark-mode .mat-sidenav-container,
    body.dark-theme .mat-sidenav-container {
      background: #0f172a !important;
    }

    body.dark-mode h1, body.dark-theme h1,
    body.dark-mode h2, body.dark-theme h2,
    body.dark-mode h3, body.dark-theme h3,
    body.dark-mode h4, body.dark-theme h4 {
      color: #f1f5f9 !important;
    }

    body.dark-mode p, body.dark-theme p,
    body.dark-mode span, body.dark-theme span,
    body.dark-mode label, body.dark-theme label {
      color: #94a3b8 !important;
    }

    body.dark-mode .page, body.dark-theme .page {
      background: #0f172a;
      color: #f1f5f9;
    }

    body.dark-mode .task-item, body.dark-theme .task-item,
    body.dark-mode .task-card, body.dark-theme .task-card {
      background: #334155 !important;
      border-color: #475569 !important;
      color: #f1f5f9;
    }

    body.dark-mode .task-title, body.dark-theme .task-title {
      color: #f1f5f9 !important;
    }

    body.dark-mode .stat-card, body.dark-theme .stat-card {
      background: #1e293b;
      border-color: #334155;
    }

    body.dark-mode .mat-mdc-table, body.dark-theme .mat-mdc-table {
      background: transparent !important;
    }

    body.dark-mode .mat-mdc-header-cell, body.dark-theme .mat-mdc-header-cell,
    body.dark-mode .mat-mdc-cell, body.dark-theme .mat-mdc-cell {
      background: #1e293b !important;
      color: #f1f5f9 !important;
      border-color: #334155 !important;
    }

    body.dark-mode .mat-mdc-row:hover, body.dark-theme .mat-mdc-row:hover {
      background: #334155 !important;
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
