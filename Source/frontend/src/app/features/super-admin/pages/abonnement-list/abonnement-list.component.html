
    <div class="p-6">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Abonnements</h1>
          <p class="text-slate-500">Suivi des souscriptions SaaS</p>
        </div>
        <button mat-flat-button color="primary" class="rounded-xl px-6 py-2">
          <mat-icon class="mr-2">add</mat-icon>
          Nouvel Abonnement
        </button>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
        <table mat-table [dataSource]="abonnements()" class="w-full">
          
          <ng-container matColumnDef="societe">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Société </th>
            <td mat-cell *matCellDef="let sub" class="p-6">
              <div class="font-bold text-slate-900 dark:text-white">{{ sub.societeNom }}</div>
              <div class="text-[10px] text-slate-500 uppercase">{{ sub.societeId }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="plan">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Plan </th>
            <td mat-cell *matCellDef="let sub" class="p-6">
              <span [class]="getPlanClass(sub.typeAbonnement)">
                {{ sub.typeAbonnement }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="periode">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Période </th>
            <td mat-cell *matCellDef="let sub" class="p-6 text-sm text-slate-600 dark:text-slate-400">
              Du {{ sub.dateDebut | date:'dd/MM/yyyy' }} au {{ sub.dateFin | date:'dd/MM/yyyy' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="statut">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Statut </th>
            <td mat-cell *matCellDef="let sub" class="p-6">
              <div class="flex items-center space-x-2">
                <div [class]="sub.actif ? 'bg-emerald-500' : 'bg-rose-500'" class="w-2 h-2 rounded-full"></div>
                <span class="text-xs font-bold text-slate-700 dark:text-slate-200">{{ sub.actif ? 'Actif' : 'Expiré' }}</span>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="p-6"></th>
            <td mat-cell *matCellDef="let sub" class="p-6 text-right">
              <button mat-icon-button class="text-slate-400 hover:text-indigo-600">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="text-slate-400 hover:text-rose-500">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors"></tr>
        </table>
      </div>
    </div>
