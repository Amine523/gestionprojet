
<div class="p-6 bg-white dark:bg-slate-900 rounded-3xl overflow-hidden">
  <div class="flex items-center justify-between mb-8">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">
      {{ data ? 'Modifier le projet' : 'Nouveau Projet' }}
    </h2>
    <button mat-icon-button (click)="onCancel()" class="text-slate-400"><mat-icon>close</mat-icon></button>
  </div>

  <form [formGroup]="projetForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nom du projet</mat-label>
        <input matInput formControlName="nom" placeholder="Ex: GestProjet V1">
        <mat-icon matPrefix class="mr-2 text-slate-400">assignment</mat-icon>
        @if (projetForm.get('nom')?.hasError('required')) {
          <mat-error>Le nom est requis</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Client</mat-label>
        <input matInput formControlName="nomClient" placeholder="Ex: Google">
        <mat-icon matPrefix class="mr-2 text-slate-400">business</mat-icon>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="4" placeholder="Objectifs et périmètre du projet..."></textarea>
    </mat-form-field>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Date de début</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Date de fin prévue</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate">
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Statut</mat-label>
        <mat-select formControlName="status">
          <mat-option value="En attente">En attente</mat-option>
          <mat-option value="En cours">En cours</mat-option>
          <mat-option value="Terminé">Terminé</mat-option>
          <mat-option value="Retard">Retard</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="flex items-center justify-end space-x-3 pt-6">
      <button mat-button type="button" (click)="onCancel()" class="rounded-xl px-6">Annuler</button>
      <button mat-flat-button color="primary" type="submit" 
              class="rounded-xl px-8 py-2 font-bold shadow-lg shadow-indigo-500/30"
              [disabled]="projetForm.invalid || isLoading()">
        {{ isLoading() ? 'Enregistrement...' : 'Enregistrer le Projet' }}
      </button>
    </div>
  </form>
</div>
