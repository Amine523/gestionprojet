
    <mat-card class="bg-white dark:bg-slate-800 rounded-2xl shadow-md overflow-hidden">
      <div class="p-6 border-b border-slate-100 dark:border-slate-700">
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Activité Récente</h3>
      </div>
      
      <div class="p-6 overflow-y-auto max-h-[500px]">
        <div class="relative space-y-8 before:absolute before:inset-0 before:ml-5 before:-translate-x-px before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-300 before:to-transparent dark:before:via-slate-600">
          
          @for (item of activites(); track item.id) {
            <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
              <!-- Dot -->
              <div class="flex items-center justify-center w-10 h-10 rounded-full border border-white dark:border-slate-800 bg-slate-200 dark:bg-slate-700 text-slate-500 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                <mat-icon class="text-sm scale-75">{{ getIcon(item.type) }}</mat-icon>
              </div>
              
              <!-- Content -->
              <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-xl border border-slate-100 dark:border-slate-700/50 bg-slate-50 dark:bg-slate-800/50 hover:shadow-lg transition-all">
                <div class="flex items-center justify-between space-x-2 mb-1">
                  <div class="font-bold text-slate-900 dark:text-white text-sm">{{ item.utilisateurNom }}</div>
                  <time class="text-xs font-medium text-indigo-500">{{ item.date | date:'shortTime' }}</time>
                </div>
                <div class="text-slate-500 dark:text-slate-400 text-xs">{{ item.description }}</div>
                @if (item.projet) {
                  <div class="mt-2 text-[10px] uppercase tracking-wider font-bold text-slate-400 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full inline-block">
                    {{ item.projet }}
                  </div>
                }
              </div>
            </div>
          } @empty {
            <div class="text-center py-10 text-slate-400">Aucune activité enregistrée</div>
          }
          
        </div>
      </div>
    </mat-card>
