
    <mat-card class="bg-white dark:bg-slate-800 rounded-2xl shadow-md overflow-hidden h-full">
      <div class="p-6 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Alertes & Notifications</h3>
        <span class="px-2 py-1 bg-rose-100 text-rose-600 text-xs font-bold rounded-full">{{ alertes().length }}</span>
      </div>
      
      <div class="overflow-y-auto max-h-[400px]">
        @for (alerte of alertes(); track alerte.id) {
          <div class="p-4 border-b border-slate-50 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors group">
            <div class="flex space-x-4">
              <div [class]="'mt-1 w-10 h-10 rounded-full flex items-center justify-center shrink-0 ' + getPriorityClass(alerte.priorite)">
                <mat-icon class="text-sm">{{ getIcon(alerte.type) }}</mat-icon>
              </div>
              <div class="flex-1">
                <div class="flex items-center justify-between">
                  <h4 class="text-sm font-bold text-slate-800 dark:text-slate-200">{{ alerte.titre }}</h4>
                  <span class="text-[10px] text-slate-400">{{ alerte.date | date:'shortTime' }}</span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">{{ alerte.message }}</p>
                
                <div class="mt-2 flex items-center space-x-3 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button class="text-[10px] font-bold text-indigo-600 hover:underline">Voir</button>
                  <button class="text-[10px] font-bold text-slate-400 hover:text-slate-600">Ignorer</button>
                </div>
              </div>
            </div>
          </div>
        } @empty {
          <div class="p-12 text-center text-slate-400">
            <mat-icon class="text-4xl mb-2 opacity-20">check_circle</mat-icon>
            <p>Aucune alerte critique</p>
          </div>
        }
      </div>
      
      <div class="p-4 bg-slate-50 dark:bg-slate-700/20 text-center">
        <button mat-button color="primary" class="text-sm font-bold">Tout voir</button>
      </div>
    </mat-card>
