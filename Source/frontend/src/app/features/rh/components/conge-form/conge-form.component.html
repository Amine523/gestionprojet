
    <div class="p-6 bg-white dark:bg-slate-900 rounded-3xl">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Demande de Congé</h2>
        <button mat-icon-button (click)="dialogRef.close()" class="text-slate-400"><mat-icon>close</mat-icon></button>
      </div>

      <form [formGroup]="congeForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Type de congé</mat-label>
          <mat-select formControlName="typePointageId">
            <mat-option value="Annuel">Congé Annuel</mat-option>
            <mat-option value="Maladie">Maladie</mat-option>
            <mat-option value="RTT">RTT</mat-option>
            <mat-option value="Exceptionnel">Exceptionnel</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Date de début</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="dateDebut">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Date de fin</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="dateFin">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Motif (Optionnel)</mat-label>
          <textarea matInput formControlName="motif" rows="3" placeholder="Précisez la raison de votre absence..."></textarea>
        </mat-form-field>

        <div class="bg-indigo-50 dark:bg-indigo-900/20 p-4 rounded-2xl flex items-center justify-between">
          <div class="flex items-center space-x-2 text-indigo-700 dark:text-indigo-300">
            <mat-icon>info</mat-icon>
            <span class="text-sm font-medium">Nombre de jours estimés</span>
          </div>
          <span class="text-lg font-black text-indigo-600 dark:text-indigo-400">{{ calculateDays() }} jours</span>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-6">
          <button mat-button type="button" (click)="dialogRef.close()" class="rounded-xl px-6">Annuler</button>
          <button mat-flat-button color="primary" type="submit" 
                  class="rounded-xl px-8 py-2 font-bold shadow-lg shadow-indigo-500/30"
                  [disabled]="congeForm.invalid || isLoading()">
            {{ isLoading() ? 'Envoi...' : 'Soumettre la demande' }}
          </button>
        </div>
      </form>
    </div>
