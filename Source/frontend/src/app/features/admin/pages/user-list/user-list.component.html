
    <div class="p-6">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Collaborateurs</h1>
          <p class="text-slate-500">Gérez les membres de votre organisation</p>
        </div>
        <button mat-flat-button color="primary" class="rounded-xl px-6 py-2">
          <mat-icon class="mr-2">person_add</mat-icon>
          Ajouter un Utilisateur
        </button>
      </div>

      <!-- Filters -->
      <div class="mb-6 flex space-x-4">
        <div class="relative flex-1 max-w-md">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</mat-icon>
          <input type="text" [(ngModel)]="searchQuery" (input)="onSearch()" 
                 placeholder="Nom, email ou poste..." 
                 class="w-full pl-10 pr-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 dark:text-slate-200">
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
        <table mat-table [dataSource]="users()" class="w-full">
          
          <ng-container matColumnDef="nom">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Utilisateur </th>
            <td mat-cell *matCellDef="let user" class="p-6">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
                  {{ user.nom.substring(0, 2).toUpperCase() }}
                </div>
                <div>
                  <div class="font-bold text-slate-900 dark:text-white">{{ user.nom }}</div>
                  <div class="text-xs text-slate-500">{{ user.email }}</div>
                </div>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Rôle </th>
            <td mat-cell *matCellDef="let user" class="p-6">
              <span class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[10px] font-bold uppercase">
                {{ user.typeUtilisateurId || 'User' }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="poste">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Poste </th>
            <td mat-cell *matCellDef="let user" class="p-6 text-sm text-slate-600 dark:text-slate-400">
              {{ user.poste || 'Non défini' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="statut">
            <th mat-header-cell *matHeaderCellDef class="p-6 font-bold text-slate-700 dark:text-slate-200"> Statut </th>
            <td mat-cell *matCellDef="let user" class="p-6">
              <span [class]="user.actif ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'" 
                    class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase">
                {{ user.actif ? 'Actif' : 'Inactif' }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="p-6"></th>
            <td mat-cell *matCellDef="let user" class="p-6 text-right">
              <button mat-icon-button class="text-slate-400 hover:text-indigo-600">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="text-slate-400 hover:text-rose-500">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors"></tr>
        </table>
        
        <mat-paginator [length]="totalItems()" [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" (page)="onPageChange($event)"
                       class="bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700">
        </mat-paginator>
      </div>
    </div>
